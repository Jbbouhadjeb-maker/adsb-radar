<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F4MYH - ADS-B Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,sans-serif}
header{height:65px;background:#172633;padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
h2{font-size:18px;margin:0}
#status{font-size:12px;color:#63e6a3}
#myPosition{margin-right:14px;padding:7px 10px;border:1px solid #2a4c64;border-radius:7px;background:#20394b;color:#fff;cursor:pointer}
#myPosition:hover{background:#2c526c}
#map{height:calc(100vh - 110px)}
footer{height:45px;background:#172633;padding:13px 18px;font-size:12px;color:#c1ccd5}
.plane{font-size:27px;color:#087cf0;text-shadow:0 0 5px white}
.leaflet-popup-content{min-width:230px;line-height:1.7}
.details{margin-top:8px;padding-top:8px;border-top:1px solid #ddd}
.details img{width:100%;border-radius:5px;margin-top:7px}
a{color:#087cf0}
</style>
</head>
<body>
<header>
<h2>✈ F4MYH — ADS-B RADAR</h2>
<button id="myPosition" type="button" title="Afficher ma position">📍 Ma position</button>
<div id="status">CONNEXION...</div>
</header>
<div id="map"></div>
<footer id="info">Initialisation du récepteur...</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([48.6,2.8],8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'© OpenStreetMap contributors',
 maxZoom:18
}).addTo(map);

const planes={};
let myPositionMarker=null;
const MAX_SILENCE=8; // secondes sans message avant suppression
const MIN_DISTANCE=0.03; // distance minimale entre deux points de traînée, en km

function esc(v){
 return String(v??'Inconnu').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}

function distance(a,b){
 const r=Math.PI/180;
 const dLat=(b[0]-a[0])*r;
 const dLon=(b[1]-a[1])*r;
 const x=Math.sin(dLat/2)**2+
 Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;
 return 6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function popupHTML(p){
 const alt=p.alt_baro==='ground'?'Au sol':
 (p.alt_baro!=null?p.alt_baro+' ft':'Inconnue');
 const speed=p.gs!=null?Math.round(p.gs*1.852)+' km/h':'Inconnue';

 return `<b>${esc((p.flight||'Vol inconnu').trim())}</b><br>
 ICAO : ${esc(p.hex)}<br>
 Altitude : ${esc(alt)}<br>
 Vitesse : ${esc(speed)}<br>
 Cap : ${esc(Math.round(p.track||0))}°<br>
 Signal : ${esc(p.rssi??'N/A')} dB<br>
 Squawk : ${esc(p.squawk??'N/A')}<br>
 Catégorie : ${esc(p.category??'N/A')}<br>
 Taux vertical : ${p.baro_rate!=null?esc(Math.round(p.baro_rate))+' ft/min':'N/A'}
 <div class="details" id="details-${esc(p.hex)}">
 Recherche des informations de l'avion...
 </div>`;
}

function icon(heading){
 return L.divIcon({
  className:'',
  html:`<div class="plane" style="transform:rotate(${Number(heading)||0}deg)">✈</div>`,
  iconSize:[32,32],
  iconAnchor:[16,16]
 });
}

function locateMe(){
 if(!navigator.geolocation){
  document.getElementById('info').textContent='La géolocalisation n’est pas disponible dans ce navigateur.';
  return;
 }
 document.getElementById('info').textContent='Recherche de votre position…';
 navigator.geolocation.getCurrentPosition(pos=>{
  const point=[pos.coords.latitude,pos.coords.longitude];
  if(!myPositionMarker){
   myPositionMarker=L.circleMarker(point,{radius:8,color:'#fff',weight:3,fillColor:'#ff4f6d',fillOpacity:1}).addTo(map);
   myPositionMarker.bindTooltip('Votre position',{permanent:false});
  }else{
   myPositionMarker.setLatLng(point);
  }
  map.setView(point,10);
  document.getElementById('info').textContent=`Votre position : ${point[0].toFixed(5)}, ${point[1].toFixed(5)}`;
 },()=>{
  document.getElementById('info').textContent='Position refusée ou indisponible. Autorisez la localisation du navigateur.';
 },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
}

document.getElementById('myPosition').addEventListener('click',locateMe);




const aircraftInfoCache = new Map();
const routeInfoCache = new Map();

function airportLabel(a) {
  if (!a) return "Non renseigné";
  const name = [a.iata, a.name, a.country_code]
    .filter(Boolean).join(" — ");
  return esc(name || a.icao || "Non renseigné");
}

async function aircraftInfo(hex, callsign, live = {}) {
  const el = document.getElementById('details-' + hex);
  if (!el) return;

  el.innerHTML = 'Recherche dans la base aéronautique...';

  try {
    let d = aircraftInfoCache.get(hex);
    let databaseStatus = '';

    if (!aircraftInfoCache.has(hex)) {
      try {
        const response = await fetch(
          'https://hexdb.io/api/v2/aircraft/' + encodeURIComponent(hex)
        );
        if (response.ok) {
          d = await response.json();
          databaseStatus = 'Fiche aéronautique trouvée';
        } else {
          d = {};
          databaseStatus = 'Aucune fiche distante pour cet avion';
        }
      } catch (e) {
        d = {};
        databaseStatus = 'Base aéronautique momentanément indisponible';
        console.warn('Fiche HexDB indisponible', e);
      }
      aircraftInfoCache.set(hex, d);
    }

    const flight = (callsign || '').trim();
    let route = flight ? routeInfoCache.get(flight) : null;

    if (flight && !route) {
      try {
        const routeResponse = await fetch(
          'https://hexdb.io/api/v2/routes/' + encodeURIComponent(flight)
        );
        if (routeResponse.ok) {
          route = await routeResponse.json();
          routeInfoCache.set(flight, route);
        }
      } catch (e) {
        console.warn('Informations de route indisponibles', e);
      }
    }

    let html = '<hr>';

    if (databaseStatus && (!d || !Object.keys(d).length)) {
      html += `<b>${esc(databaseStatus)}</b><br>`;
      html += 'Données reçues directement par votre récepteur ADS-B :<br>';
      html += `Indicatif : <b>${esc((live.flight || flight || 'Inconnu').trim())}</b><br>`;
      html += `ICAO : <b>${esc(live.hex || hex)}</b><br>`;
      if (live.alt_baro != null)
        html += `Altitude : ${esc(live.alt_baro === 'ground' ? 'Au sol' : live.alt_baro + ' ft')}<br>`;
      if (live.gs != null)
        html += `Vitesse : ${esc(Math.round(live.gs * 1.852))} km/h<br>`;
      if (live.track != null)
        html += `Cap : ${esc(Math.round(live.track))}°<br>`;
      if (live.squawk)
        html += `Squawk : ${esc(live.squawk)}<br>`;
      html += '<br>';
    }

    const photo = d.images?.thumbnail || d.images?.full;
    if (photo) {
      html += `<img src="${esc(photo)}" alt="Photo de l'avion"
        style="width:100%;max-height:150px;object-fit:cover;
        border-radius:8px;margin:6px 0">`;
    }

    html += '<b>IDENTIFICATION</b><br>';

    if (d.registration)
      html += `Immatriculation : <b>${esc(d.registration)}</b><br>`;

    if (d.manufacturer)
      html += `Constructeur : ${esc(d.manufacturer)}<br>`;

    if (d.type)
      html += `Modèle : ${esc(d.type)}<br>`;

    if (d.icao_type_code)
      html += `Type ICAO : ${esc(d.icao_type_code)}<br>`;

    if (d.registered_owner)
      html += `Compagnie / propriétaire : ${esc(d.registered_owner)}<br>`;

    if (d.operator_flag_code)
      html += `Code opérateur : ${esc(d.operator_flag_code)}<br>`;

    if (route) {
      html += '<br><b>TRAJET DU VOL</b><br>';
      html += `Vol : <b>${esc(route.callsign || flight)}</b><br>`;
      html += `Départ : ${airportLabel(route.origin)}<br>`;
      html += `Arrivée : ${airportLabel(route.destination)}<br>`;

      if (route.origin?.icao)
        html += `Code ICAO départ : ${esc(route.origin.icao)}<br>`;

      if (route.destination?.icao)
        html += `Code ICAO arrivée : ${esc(route.destination.icao)}<br>`;
    } else if (flight) {
      html += '<br>Trajet : non disponible dans la base';
    }

    html += `<br><a href="https://hexdb.io/api/v2/aircraft/${encodeURIComponent(hex)}"
      target="_blank" rel="noopener">Voir la fiche HexDB</a>`;

    if (el) el.innerHTML = html;

  } catch (e) {
    console.error('Erreur HexDB :', e);
    if (el) {
      el.innerHTML = '<b>Données ADS-B locales</b><br>' +
        `Indicatif : ${esc((live.flight || callsign || 'Inconnu').trim())}<br>` +
        `ICAO : ${esc(live.hex || hex)}<br>` +
        '<br>La fiche distante HexDB est indisponible pour cet avion.';
    }
  }
}

function createPlane(p){
 const hex=p.hex;
 const marker=L.marker([p.lat,p.lon],{icon:icon(p.track)}).addTo(map);
 const trail=L.polyline([],{color:'#168bff',weight:3,opacity:.8}).addTo(map);
 const plane={marker,trail,points:[],lastPosition:null,latest:p};

 marker.bindPopup(popupHTML(p),{
  autoPan:true,
  keepInView:true,
  closeOnClick:false
 });
 marker.on('popupopen',()=>{
  aircraftInfo(hex,(plane.latest?.flight||'').trim(),plane.latest||{});
 });

 planes[hex]=plane;
 return plane;
}

function keepPopupVisible(obj){
 if(!obj.marker.isPopupOpen())return;
 map.panInside(obj.marker.getLatLng(),{
  paddingTopLeft:[24,24],
  paddingBottomRight:[24,24],
  animate:false
 });
}

async function refresh(){
 try{
  const res=await fetch('/data/aircraft.json?t='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw new Error('Fichier aircraft.json inaccessible');

  const data=await res.json();
  const received=new Set();

  for(const p of(data.aircraft||[])){
   if(!p.hex)continue;

   // Suppression après 8 secondes sans message radio.
   if(typeof p.seen==='number'&&p.seen>MAX_SILENCE)continue;

   received.add(p.hex);

   // Sans coordonnées GPS, on ne peut pas tracer cet avion.
   if(typeof p.lat!=='number'||typeof p.lon!=='number')continue;

   let obj=planes[p.hex];
   if(!obj)obj=createPlane(p);
   obj.latest=p;

   const pos=[p.lat,p.lon];
   const now=Date.now();

   if(!obj.lastPosition||
      distance(obj.lastPosition,pos)>=MIN_DISTANCE||
      now-obj.lastPosition.time>10000){

    obj.points.push(pos);
    obj.lastPosition={pos,time:now};

    if(obj.points.length>1000)obj.points.shift();
    obj.trail.setLatLngs(obj.points);
   }

   obj.marker.setLatLng(pos);
   obj.marker.setIcon(icon(p.track));
   keepPopupVisible(obj);

   // Ne jamais remplacer le contenu d'une fenêtre ouverte : la réponse
   // HexDB est asynchrone et serait effacée au prochain rafraîchissement.
   if(!obj.marker.isPopupOpen()){
    obj.marker.setPopupContent(popupHTML(p));
   }
  }

  // Toute disparition du flux local supprime le marqueur et sa traînée.
  for(const hex of Object.keys(planes)){
   if(!received.has(hex)){
    map.removeLayer(planes[hex].marker);
    map.removeLayer(planes[hex].trail);
    delete planes[hex];
   }
  }

  document.getElementById('status').textContent='● RÉCEPTION ACTIVE';
  document.getElementById('info').textContent=
   `${Object.keys(planes).length} avion(s) reçus | ${data.messages??0} messages | Traînées ADS-B en direct`;

 }catch(e){
  document.getElementById('status').textContent='● PERTE DE CONNEXION';
  document.getElementById('info').textContent=e.message;

  // Si le flux local est inaccessible, on retire tous les avions.
  for(const hex of Object.keys(planes)){
   map.removeLayer(planes[hex].marker);
   map.removeLayer(planes[hex].trail);
   delete planes[hex];
  }
 }
}

refresh();
setInterval(refresh,1000);
</script>
</body>
</html>
